version: 2
project_name: switchyard

builds:
  - main: ./cmd/switchyard
    env: [CGO_ENABLED=0]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, NOTICE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  format: "{{ .Message }}"
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^ci:'
      - '^chore:'
      - '^test:'
      - 'dependabot'

release:
  github:
    owner: LuGG000
    name: switchyard
  footer: |
    ## Update

    ```
    go install github.com/LuGG000/switchyard/cmd/switchyard@latest
    ```

    or download the archive for your system below. `switchyard update` shows whether you are current.
