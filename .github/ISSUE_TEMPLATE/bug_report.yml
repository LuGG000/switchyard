name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `switchyard --version` and `claude --version`, and your operating system.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `switchyard doctor`
      description: Remove anything private. Never paste credentials, tokens or raw `claude auth status` output.
      render: text
